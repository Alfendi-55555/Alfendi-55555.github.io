# main 브랜치에 push하면 빌드해서 GitHub Pages에 배포한다.
# 하루 두 번 예약 실행으로 게임 소식과 음악 시트를 다시 읽는다.
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔 둘 것.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼
  schedule:
    - cron: '17 23,11 * * *'  # UTC 23:17 · 11:17 = 한국시간 08:17 · 20:17 (GitHub 사정으로 늦게 시작할 수 있음)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site
        env:
          # 저장소 Settings → Secrets and variables → Actions → Variables (비어 있으면 content/music.json)
          MUSICLIST_CSV: ${{ vars.MUSICLIST_CSV }}
          # 한줄 리뷰 시트(리뷰 탭) 게시 주소 (비어 있으면 games.json 의 review 만)
          REVIEWS_CSV: ${{ vars.REVIEWS_CSV }}
          # 방명록 Apps Script 웹앱 주소 (비어 있으면 content/guestbook.json 샘플만 보임)
          GUESTBOOK_API: ${{ vars.GUESTBOOK_API }}
        run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
