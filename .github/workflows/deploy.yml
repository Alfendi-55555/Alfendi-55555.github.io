# main 브랜치에 push하면 빌드해서 GitHub Pages에 배포한다.
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔 둘 것.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site
        env:
          # 저장소 Settings → Secrets and variables → Actions → Variables (비어 있으면 content/music.json)
          MUSICLIST_CSV: ${{ vars.MUSICLIST_CSV }}
        run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
